# Faithful PAIN path encoder adapted to DBLP paper-conference link prediction.
# The default artifact tag is exact L=3. If preprocessing uses, for example,
# --max-paths-per-root 100000, change this to L3_cap100000 for every arm.
device: cuda:0

data:
  preprocessed_dir: data/preprocessed/DBLP
  shared_path: data/preprocessed/DBLP/shared.pt
  artifact_tag: L3

model:
  hidden_dim: 128
  num_layers: 5
  lstm_depth: 2
  path_length: 3
  dropout: 0.0
  share_lstm: true
  reverse_paths: true
  mark_neighbors: true
  shortest_path_encoding: false
  path_aggregation: sum
  jumping_knowledge: last
  use_node_types: true
  node_embedding_init_std: 0.1

  # Exact chunking: no paths are discarded. DBLP stores compact path tensors
  # on the host and widens/transfers only the active chunk to the V100.
  path_chunk_size: 50000
  checkpoint_chunks: true
  paths_on_device: false

training:
  # These four axes match the corrected DBLP comparison contract in the guide:
  # full-conference evaluation, validation-MRR selection, all 19 false venues,
  # and a 1000-epoch / 200-patience budget.
  epochs: 1000
  learning_rate: 0.005
  weight_decay: 0.001
  early_stopping_patience: 200
  gradient_clip_norm: 5.0
  embedding_regularization: 0.000001
  max_hours: 22
  deterministic: true

evaluation:
  protocol: filtered_full_conference_ranking
  num_candidates: 20
  hits_k: [1, 3, 5, 10]
  threshold: 0.5
