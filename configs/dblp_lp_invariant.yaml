# Same PAIN architecture and training protocol as dblp_lp.yaml. Keep the
# invariant artifacts in a separate directory so regenerating them cannot
# replace the ordinary/augmentation data used by running HPC jobs.
device: cuda:0

data:
  preprocessed_dir: data/preprocessed/DBLP_invariant
  shared_path: data/preprocessed/DBLP_invariant/shared.pt
  artifact_tag: L3_stratcap256

model:
  hidden_dim: 128
  num_layers: 5
  lstm_depth: 2
  path_length: 3
  dropout: 0.0
  share_lstm: true
  reverse_paths: true
  mark_neighbors: true
  shortest_path_encoding: false
  path_aggregation: sum
  jumping_knowledge: last
  use_node_types: true
  node_embedding_init_std: 0.1
  path_chunk_size: 50000
  checkpoint_chunks: true
  paths_on_device: false

training:
  epochs: 1000
  learning_rate: 0.005
  weight_decay: 0.001
  early_stopping_patience: 200
  gradient_clip_norm: 5.0
  embedding_regularization: 0.000001
  max_hours: 22
  deterministic: true

evaluation:
  protocol: filtered_full_conference_ranking
  num_candidates: 20
  hits_k: [1, 3, 5, 10]
  threshold: 0.5
