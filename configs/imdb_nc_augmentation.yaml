# Joint v1-v4 PAIN training with an update-matched default budget.
device: cuda:0

data:
  preprocessed_dir: data/preprocessed/IMDB
  shared_path: data/preprocessed/IMDB/shared.pt

model:
  hidden_dim: 128
  num_layers: 5
  lstm_depth: 2
  head_layers: 2
  path_length: 3
  dropout: 0.0
  share_lstm: true
  reverse_paths: true
  mark_neighbors: true
  shortest_path_encoding: false
  path_aggregation: sum
  jumping_knowledge: last
  use_node_types: true
  path_chunk_size: 100000
  checkpoint_chunks: true
  paths_on_device: true

training:
  selection_metric: mean_macro_f1
  # Four variant updates per super-epoch. 250 super-epochs therefore cap the
  # run at the same 1,000 optimizer updates as a 1,000-epoch baseline.
  epochs: 1000
  super_epochs: 250
  learning_rate: 0.001
  weight_decay: 0.0
  lr_factor: 0.5
  lr_patience: 5
  min_learning_rate: 0.00001
  early_stopping_patience: 20
  gradient_clip_norm: 5.0
  max_hours: 12
  deterministic: true
